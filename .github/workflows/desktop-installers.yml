name: Flower Desktop 首装安装包

on:
  pull_request:
    branches: [main, v2]
    paths:
      - '.github/workflows/desktop-installers.yml'
      - 'apps/desktop/installer/**'
      - 'apps/desktop/testing/verify-setup-windows.ps1'
  push:
    tags: ['flower-desktop-installers-v*']
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      manual_mac:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.source.outputs.number }}
      sha: ${{ steps.source.outputs.sha }}
      mac: ${{ steps.source.outputs.mac }}
    steps:
      - id: source
        name: 核对正式版本并锁定应用源码
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          MANUAL_MAC: ${{ inputs.manual_mac }}
        run: |
          set -eu
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # 首个带公开便携包的版本是固定的跨平台首装验收样本。
            VERSION=0.1.5
            MANUAL_MAC=true
          elif [[ -z "$VERSION" ]]; then
            VERSION="${GITHUB_REF_NAME#flower-desktop-installers-v}"
            MANUAL_MAC=true
          fi
          [[ "$VERSION" =~ ^(0|[1-9][0-9]{0,7})\.(0|[1-9][0-9]{0,7})\.(0|[1-9][0-9]{0,7})$ ]]
          tag="flower-desktop-v$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" | jq -e --arg tag "$tag" '.tag_name==$tag and (.draft|not) and (.prerelease|not)'
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "mac=$MANUAL_MAC" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 下载正式便携包与固定版本的 Inno Setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloads = Join-Path $env:RUNNER_TEMP downloads
          gh release download "flower-desktop-v$env:VERSION" --repo $env:GITHUB_REPOSITORY -p '*-win32-x64-portable.zip' -p SHA256SUMS.txt --dir $downloads
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release download is-7_1_1 --repo jrsoftware/issrc -p innosetup-7.1.1-x64.exe --dir $downloads
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: 制作安装 EXE 并验收真实安装、启动和卸载
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP installers
          ./apps/desktop/installer/build-windows.ps1 -Version $env:VERSION -Downloads (Join-Path $env:RUNNER_TEMP downloads) -BuildDir (Join-Path $env:RUNNER_TEMP build) -Output $out
          ./apps/desktop/testing/verify-setup-windows.ps1 -Version $env:VERSION -Setup (Join-Path $out "Flower-Desktop-$env:VERSION-win32-x64-setup.exe")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-win32-x64
          path: ${{ runner.temp }}/installers/*.exe
          if-no-files-found: error
          compression-level: 0

  macos:
    needs: version
    if: needs.version.outputs.mac == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
          - {arch: x64, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      VERSION: ${{ needs.version.outputs.number }}
      ARCH: ${{ matrix.arch }}
      FLOWER_MAC_REQUIRE_SIGNING: '0'
    steps:
      - name: 检出当前发行版本的原始源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: 生成临时签名 DMG 并验证对应架构的实际应用
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm exec -- tsc --build packages/agent-runtime
          out="$RUNNER_TEMP/manual-mac"
          node apps/desktop/scripts/release-macos.mjs --version "$VERSION" --arch "$ARCH" --output "$out"
          node apps/desktop/testing/verify-macos-release.mjs --version "$VERSION" --arch "$ARCH" --output "$out"
          mv "$out/Flower-Desktop-$VERSION-darwin-$ARCH.dmg" "$out/Flower-Desktop-$VERSION-darwin-$ARCH-manual.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/manual-mac/*-manual.dmg
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [version, windows, macos]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.repository == 'SilentFlower/flower' &&
      needs.version.result == 'success' && needs.windows.result == 'success' &&
      ((needs.version.outputs.mac == 'true' && needs.macos.result == 'success') ||
      (needs.version.outputs.mac == 'false' && needs.macos.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: flower-desktop-installers-${{ needs.version.outputs.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: installer-*
          path: ${{ runner.temp }}/installers
          merge-multiple: true
      - name: 向版本页添加安装程序、校验值和使用说明
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.number }}
          MANUAL_MAC: ${{ needs.version.outputs.mac }}
        run: python3 apps/desktop/installer/publish.py "$RUNNER_TEMP/installers" "$VERSION" "$MANUAL_MAC"
