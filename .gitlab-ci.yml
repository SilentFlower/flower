# flower 仓内网 GitLab CI 入口(company 分支 + MR pipeline)
#
# 目的:
#   1. 在 company 分支 push / tag 时 build 镜像 push 到 Harbor(给业务方消费)
#   2. 在 MR pipeline 时跑 code-review(flower 自评 PR,dogfooding)
#
# 分支隔离:本文件仅在 company 分支存在;origin (github) 不参与 GitLab CI
#
# 模板来源:digital-rd-infra/devops-infra(devops-infra-harness)

include:
  - project: 'digital-rd-infra/devops-infra'
    ref: main
    file:
      - '/templates/.gitlab-ci-base.yml'    # 提供 HARBOR_HOST / KANIKO_IMAGE 等全局变量
      - '/templates/node-cli-image.yml'     # 提供 .node-cli-image hidden job(Kaniko build & push)

# Workflow rules:允许 company / company-test 分支 push / tag / MR pipeline 触发
# company-test:e2e 验证测试分支,build 出独立 tag 镜像不污染 latest(见 build-flower-code-reviewer rules)
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "company"'
    - if: '$CI_COMMIT_BRANCH == "company-test"'
    - when: never

# .gitlab-ci-base.yml 已声明 stages: [build, package, deploy];本仓追加 review
stages:
  - build
  - review

# ─────────────────────────────────────────────────────────────────────
# Job 1: build flower-code-reviewer 镜像
# 只在 push 到 company / tag 时跑(MR pipeline 不重复 build)
# ─────────────────────────────────────────────────────────────────────
build-flower-code-reviewer:
  extends: .node-cli-image
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "company"'
    # company-test 分支:产独立 tag(company-test-<sha>)、**不推 latest**,避免污染业务方
    # 默认 latest 引用。e2e 验证通过后,merge company-test → company 走正常 build,latest 才更新。
    - if: '$CI_COMMIT_BRANCH == "company-test"'
      variables:
        IMAGE_TAG: "company-test-${CI_COMMIT_SHORT_SHA}"
        PUSH_LATEST: "false"
    - when: never
  # Override harness 默认的 tags: [infra-build-proxy](该 tag 的 runner 在本实例不存在)。
  # 改用 default instance runner(tags=[]),与 iqs-boot 的 package-java 同路径
  tags: []
  # pull_policy: if-not-present(2026-05-22 从 always 改默认):
  # Runner admin 白名单不稳(实测过 hostAliases / allowed_pull_policies 被改坏)。
  # 改 if-not-present 让 build 不依赖 admin 配置,Kaniko base image 稳定缓存安全。
  image:
    name: ${KANIKO_IMAGE}
    entrypoint: [""]
    pull_policy: if-not-present
  variables:
    IMAGE_NAME: 'flower-code-reviewer'
    SUB_DIR: 'packages/flower-code-reviewer'
    REGISTRY_NAMESPACE: 'base'

# ─────────────────────────────────────────────────────────────────────
# Job 2: code-review(dogfooding — flower 自评 PR)
#
# 临时方案:inline 复制 harness .flower-code-review hidden job 完整定义,
# 因为 include application.yml 会拖入 V3 plan-pipeline / run-child-pipeline。
# 等 harness 拆出独立 templates/review-flower-code-reviewer.yml 后,
# 可改回:
#   code-review:
#     extends: .flower-code-review
#
# 4 个 secret(REVIEWER_BOT_TOKEN / LLM_BASE_URL / LLM_API_KEY / SIEM_INGEST_URL)
# 已配 project-level CI Variables
# ─────────────────────────────────────────────────────────────────────
code-review:
  stage: review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - when: never
  needs: []
  tags: []
  image:
    # company-test 验证期间 dogfooding 拉本次 build 的隔离 tag(含 ref/bash 白名单/exit 信号 3 个 fix)。
    # 验证通过后,merge company-test → company 时此行回退为 :latest(走 company 正常 build)。
    name: "${HARBOR_HOST}/base/flower-code-reviewer:company-test-2180a260"
    pull_policy: always
  variables:
    FLOWER_MAX_FILES: "50"
    FLOWER_MAX_FILE_SIZE: "51200"
    GITLAB_TOKEN: "${REVIEWER_BOT_TOKEN}"
    GITLAB_HOST: "${CI_SERVER_URL}"
  script:
    - |
      set -euo pipefail

      MISSING=""
      [ -z "${GITLAB_TOKEN:-}" ]    && MISSING="${MISSING} GITLAB_TOKEN(REVIEWER_BOT_TOKEN)"
      [ -z "${LLM_BASE_URL:-}" ]    && MISSING="${MISSING} LLM_BASE_URL"
      [ -z "${LLM_API_KEY:-}" ]     && MISSING="${MISSING} LLM_API_KEY"
      [ -z "${SIEM_INGEST_URL:-}" ] && MISSING="${MISSING} SIEM_INGEST_URL"
      if [ -n "${MISSING}" ]; then
        echo "❌ flower-code-reviewer 必填 secret 缺失:${MISSING}"
        exit 1
      fi

      echo ">>> 🤖 reviewer 探针: max_files=${FLOWER_MAX_FILES}, mr_iid=${CI_MERGE_REQUEST_IID}"
      echo ">>> 🤖 secret 长度: gitlab_token_len=${#GITLAB_TOKEN}, llm_api_key_len=${#LLM_API_KEY}, siem_url_len=${#SIEM_INGEST_URL}"

      flower-review --mr-iid "${CI_MERGE_REQUEST_IID}"
  allow_failure: true
  timeout: 10 minutes
